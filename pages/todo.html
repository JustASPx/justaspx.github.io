<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do App Avancée — Zakaria Atrkzi</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .todo-app { max-width: 800px; margin: 0 auto; padding: 2rem 1rem; padding-top: 100px; }
    .todo-header { text-align: center; margin-bottom: 2rem; }
    .todo-header h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    .todo-header p { color: var(--text-muted); }
    .todo-input-group { display: grid; grid-template-columns: 1fr auto auto auto; gap: 0.5rem; margin-bottom: 1.5rem; }
    .todo-input-group input, .todo-input-group select { padding: 0.75rem 1rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-family: inherit; }
    .todo-input-group input:focus, .todo-input-group select:focus { outline: none; border-color: var(--primary); }
    .todo-filters { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; align-items: center; justify-content: space-between; }
    .filter-group { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    .filter-group select, .filter-group input { padding: 0.5rem 0.75rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 0.9rem; }
    .stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
    .stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; text-align: center; }
    .stat-box .val { font-size: 1.5rem; font-weight: 800; color: var(--primary); }
    .stat-box .lbl { font-size: 0.8rem; color: var(--text-muted); }
    .todo-list { display: flex; flex-direction: column; gap: 0.75rem; }
    .todo-item {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 1rem; display: flex; align-items: center; gap: 1rem; cursor: grab;
      transition: var(--transition); position: relative;
    }
    .todo-item:hover { border-color: var(--primary); box-shadow: var(--shadow); }
    .todo-item.dragging { opacity: 0.5; transform: scale(0.98); }
    .todo-item.completed .todo-text { text-decoration: line-through; opacity: 0.6; }
    .todo-item.overdue { border-left: 4px solid #ef4444; }
    .todo-item.high-priority { border-left: 4px solid #f59e0b; }
    .todo-check { width: 22px; height: 22px; border: 2px solid var(--primary); border-radius: 6px; cursor: pointer; display: grid; place-items: center; color: white; transition: var(--transition); flex-shrink: 0; }
    .todo-check.checked { background: var(--primary); }
    .todo-content { flex: 1; min-width: 0; }
    .todo-text { font-weight: 500; margin-bottom: 0.25rem; word-break: break-word; }
    .todo-meta { display: flex; gap: 0.75rem; flex-wrap: wrap; font-size: 0.8rem; color: var(--text-muted); }
    .todo-meta span { display: flex; align-items: center; gap: 0.25rem; }
    .tag { padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.7rem; font-weight: 600; }
    .tag-cat-work { background: #dbeafe; color: #1e40af; }
    .tag-cat-personal { background: #dcfce7; color: #166534; }
    .tag-cat-study { background: #fef3c7; color: #92400e; }
    .tag-prio-high { background: #fee2e2; color: #991b1b; }
    .tag-prio-medium { background: #fef3c7; color: #92400e; }
    .tag-prio-low { background: #e0f2fe; color: #075985; }
    .todo-actions { display: flex; gap: 0.5rem; }
    .todo-actions button { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; display: grid; place-items: center; transition: var(--transition); }
    .todo-actions button:hover { background: var(--primary); color: white; border-color: var(--primary); }
    .todo-actions .btn-delete:hover { background: #ef4444; border-color: #ef4444; }
    .empty-state { text-align: center; padding: 3rem; color: var(--text-muted); }
    .empty-state i { font-size: 3rem; margin-bottom: 1rem; opacity: 0.5; }
    .bulk-actions { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .bulk-actions button { padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; font-size: 0.85rem; transition: var(--transition); }
    .bulk-actions button:hover { background: var(--primary); color: white; border-color: var(--primary); }
    .import-export { display: flex; gap: 0.5rem; margin-top: 1rem; }
    .import-export label, .import-export button { padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; font-size: 0.85rem; transition: var(--transition); }
    .import-export label:hover, .import-export button:hover { background: var(--primary); color: white; }
    .import-export input[type="file"] { display: none; }
    @media (max-width: 640px) {
      .todo-input-group { grid-template-columns: 1fr; }
      .stats-bar { grid-template-columns: repeat(2, 1fr); }
      .todo-filters { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="logo"><span>ZA</span> Zakaria Atrkzi</a>
      <ul class="nav-links" id="navLinks">
        <li><a href="../index.html">Accueil</a></li>
        <li><a href="../index.html#apropos">À propos</a></li>
        <li><a href="../index.html#competences">Compétences</a></li>
        <li><a href="../index.html#projets">Projets</a></li>
        <li><a href="../index.html#contact">Contact</a></li>
        <li><a href="todo.html" class="active">To-Do App</a></li>
        <li><a href="dashboard.html">Météo</a></li>
      </ul>
      <div class="nav-actions">
        <button class="btn-icon" id="themeToggle" aria-label="Changer de thème"><i class="fas fa-moon"></i></button>
        <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
      </div>
    </div>
  </nav>

  <main class="todo-app">
    <div class="todo-header">
      <h1><i class="fas fa-check-double" style="color:var(--primary);"></i> To-Do App Avancée</h1>
      <p>Gérez vos tâches efficacement avec catégories, priorités et dates.</p>
    </div>

    <div class="stats-bar" id="statsBar">
      <div class="stat-box"><div class="val" id="statTotal">0</div><div class="lbl">Total</div></div>
      <div class="stat-box"><div class="val" id="statActive">0</div><div class="lbl">En cours</div></div>
      <div class="stat-box"><div class="val" id="statCompleted">0</div><div class="lbl">Terminées</div></div>
      <div class="stat-box"><div class="val" id="statOverdue">0</div><div class="lbl">En retard</div></div>
    </div>

    <form class="todo-input-group" id="todoForm">
      <input type="text" id="todoInput" placeholder="Nouvelle tâche..." required autocomplete="off">
      <select id="todoCategory">
        <option value="work">Travail</option>
        <option value="personal">Personnel</option>
        <option value="study">Études</option>
      </select>
      <select id="todoPriority">
        <option value="high">Haute</option>
        <option value="medium" selected>Moyenne</option>
        <option value="low">Basse</option>
      </select>
      <input type="date" id="todoDate" required>
    </form>
    <button type="submit" class="btn btn-primary" style="width:100%;margin-bottom:1.5rem;" id="addBtn">
      <i class="fas fa-plus"></i> Ajouter la tâche
    </button>

    <div class="todo-filters">
      <div class="filter-group">
        <select id="filterStatus">
          <option value="all">Toutes</option>
          <option value="active">En cours</option>
          <option value="completed">Terminées</option>
        </select>
        <select id="filterCategory">
          <option value="all">Toutes catégories</option>
          <option value="work">Travail</option>
          <option value="personal">Personnel</option>
          <option value="study">Études</option>
        </select>
        <select id="filterPriority">
          <option value="all">Toutes priorités</option>
          <option value="high">Haute</option>
          <option value="medium">Moyenne</option>
          <option value="low">Basse</option>
        </select>
      </div>
      <input type="text" id="searchInput" placeholder="Rechercher..." style="min-width:180px;">
    </div>

    <div class="bulk-actions">
      <button id="btnCompleteAll"><i class="fas fa-check"></i> Tout terminer</button>
      <button id="btnDeleteCompleted"><i class="fas fa-trash"></i> Supprimer terminées</button>
      <button id="btnClearAll" style="color:#ef4444;"><i class="fas fa-ban"></i> Tout supprimer</button>
    </div>

    <div class="todo-list" id="todoList"></div>

    <div class="import-export">
      <button id="btnExport"><i class="fas fa-download"></i> Exporter JSON</button>
      <label for="importFile"><i class="fas fa-upload"></i> Importer JSON</label>
      <input type="file" id="importFile" accept=".json">
    </div>
  </main>

  <script src="../js/todo.js"></script>
</body>
</html>
